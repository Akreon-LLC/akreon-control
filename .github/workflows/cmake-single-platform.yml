name: CMake (Linux, GCC and Clang)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Debug
  PRESET: host-default

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc14
            cc: gcc-14
            cxx: g++-14
          - compiler: gcc16
            cc: gcc-16
            cxx: g++-16
          - compiler: clang22
            cc: clang-22
            cxx: clang++-22

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Akreon-LLC/akreon-linalg
          ref: ${{ vars.AKREON_LINALG_REF || 'main' }}
          path: .deps/akreon-linalg
          token: ${{ secrets.AKREON_DEPENDENCY_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: Akreon-LLC/akreon-convex
          ref: ${{ vars.AKREON_CONVEX_REF || 'main' }}
          path: .deps/akreon-convex
          token: ${{ secrets.AKREON_DEPENDENCY_TOKEN || github.token }}

      - name: Install compiler toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y wget

          if [[ "${{ matrix.compiler }}" == "gcc16" ]]; then
            sudo apt-get install -y gnupg
            wget --tries=5 --timeout=30 \
              --output-document=/tmp/ubuntu-toolchain-r-test.asc \
              "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xC8EC952E2A0E1FBDC5090F6A2C277A0A352154E5"
            test "$(gpg --show-keys --with-colons /tmp/ubuntu-toolchain-r-test.asc \
              | awk -F: '$1 == "fpr" { print $10; exit }')" \
              = "C8EC952E2A0E1FBDC5090F6A2C277A0A352154E5"
            sudo install -m 0644 /tmp/ubuntu-toolchain-r-test.asc \
              /etc/apt/keyrings/ubuntu-toolchain-r-test.asc
            echo "deb [signed-by=/etc/apt/keyrings/ubuntu-toolchain-r-test.asc] https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu noble main" \
              | sudo tee /etc/apt/sources.list.d/ubuntu-toolchain-r-test.list
            sudo apt-get update
            sudo apt-get install -y g++-16
          elif [[ "${{ matrix.compiler }}" == "gcc14" ]]; then
            sudo apt-get install -y g++-14
          fi

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-format-22
          if [[ "${{ matrix.compiler }}" == "clang22" ]]; then
            sudo apt-get install -y libc++-22-dev libc++abi-22-dev lld-22
          fi

      # --- Set CC/CXX for subsequent steps ---
      - name: Select compiler
        run: |
          echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV

      - name: Show compiler versions
        run: |
          echo "Using CC=$CC, CXX=$CXX"
          $CC --version
          $CXX --version
          clang-format-22 --version

      - name: Select clang-format
        run: echo "PATH=/usr/lib/llvm-22/bin:$PATH" >> $GITHUB_ENV

      # --- Configure ---
      - name: Configure CMake (Preset)
        run: |
          CMAKE_COMPILER_ARGS=()
          if [[ "${{ matrix.compiler }}" == "clang22" ]]; then
            CMAKE_COMPILER_ARGS+=("-DCMAKE_CXX_FLAGS=-stdlib=libc++")
            CMAKE_COMPILER_ARGS+=("-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld")
          fi

          cmake --preset ${{ env.PRESET }} \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DFETCHCONTENT_SOURCE_DIR_AKREON_LINALG="$GITHUB_WORKSPACE/.deps/akreon-linalg" \
            -DFETCHCONTENT_SOURCE_DIR_AKREON_CONVEX="$GITHUB_WORKSPACE/.deps/akreon-convex" \
            "${CMAKE_COMPILER_ARGS[@]}"

      # --- Build ---
      - name: Build
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc16" ]]; then
            # Match Convex: serialize template-heavy compilation and report
            # commands, elapsed time, and peak resident memory.
            /usr/bin/time -v cmake --build --preset ${{ env.PRESET }} --parallel 1 --verbose
          elif [[ "${{ matrix.compiler }}" == "clang22" ]]; then
            cmake --build --preset ${{ env.PRESET }} --parallel 1
          else
            cmake --build --preset ${{ env.PRESET }} --parallel 2
          fi

      - name: Check clang-format
        run: cmake --build --preset ${{ env.PRESET }} --target clang_format_check

      # --- Test ---
      - name: Run tests
        run: ctest --test-dir out/build/host-default --output-on-failure -C ${{ env.BUILD_TYPE }}

      - name: Install and test package consumer
        run: |
          cmake --install out/build/host-default --prefix "$RUNNER_TEMP/akreon-install"
          cmake -S examples/consumer -B "$RUNNER_TEMP/consumer" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/akreon-install" \
            "${{ matrix.compiler == 'clang22' && '-DCMAKE_CXX_FLAGS=-stdlib=libc++' || '-DCMAKE_CXX_FLAGS=' }}"
          cmake --build "$RUNNER_TEMP/consumer"
          ctest --test-dir "$RUNNER_TEMP/consumer" --output-on-failure

      - uses: actions/setup-python@v5
        if: matrix.compiler == 'clang22'
        with:
          python-version: '3.12'

      - name: Build and install Python bindings
        if: matrix.compiler == 'clang22'
        run: |
          python -m pip install ".[examples,test]" \
            --config-settings=build-dir=out/build/python \
            --config-settings=build.tool-args=-j1 \
            --config-settings=cmake.define.CMAKE_CXX_FLAGS=-stdlib=libc++ \
            --config-settings=cmake.define.AKREON_CONTROL_BUILD_BINDING_TESTS=ON \
            --config-settings=cmake.define.FETCHCONTENT_SOURCE_DIR_AKREON_LINALG="$GITHUB_WORKSPACE/.deps/akreon-linalg" \
            --config-settings=cmake.define.FETCHCONTENT_SOURCE_DIR_AKREON_CONVEX="$GITHUB_WORKSPACE/.deps/akreon-convex"

      - name: Check binding style and tests
        if: matrix.compiler == 'clang22'
        run: |
          python -m ruff check bindings/python
          python -m ruff format --check bindings/python
          ctest --test-dir out/build/python --output-on-failure
          python -m pytest bindings/python/tests

  docs:
    name: Doxygen docs
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate Doxygen docs
        run: doxygen Doxyfile

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: docs/doxygen/html
